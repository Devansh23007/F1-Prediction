name: Weekly data refresh

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday, after the race weekend
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Pull new races and rebuild features + reports
        run: python src/update_data.py --backtest
      - name: Commit changes
        run: |
          git config user.name "f1-bot"
          git config user.email "f1-bot@users.noreply.github.com"
          git add data/raw data/processed reports
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git push
